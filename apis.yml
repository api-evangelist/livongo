name: Livongo
description: 'Livongo Health is a digital chronic-condition management platform for diabetes,
  hypertension, weight, and prehypertension prevention, pairing connected devices (blood-glucose
  meters, blood-pressure cuffs, connected scales) with a mobile app, real-time monitoring, and
  certified health coaching delivered at no cost through employers and health plans. Founded in
  2008 and taken public in 2019, Livongo was acquired by Teladoc Health in 2020; the standalone
  www.livongo.com site now 301-redirects to teladochealth.com/livongo, where Livongo operates as
  a consumer-facing product line. It is a patient/member health product, not a developer platform:
  no public API, developer portal, SDKs, or API documentation surface exists. Backed by
  Kleiner Perkins, Sapphire Ventures, and Threshold Ventures.'
